[package]
name = "piggy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ground-truth Claude Code token accounting: JSONL parser, SQLite store, pricing."

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps unknown/user keys in their original order so our writes to
# settings.json produce minimal diffs (matches Claude Code's own 2-space writer).
# arbitrary_precision stores every JSON number as its exact source text, so unknown
# numeric config (huge integers, high-precision decimals, telemetry floats) round-trips
# byte-for-byte instead of being reformatted through f64 — see settings.rs / sweep.rs.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
dirs = "5"
# Install-engine deps (head-approved for M2): download + verify + extract release assets.
# Also used by M3 discovery (blocking GitHub search over rustls, JSON parsed via serde_json).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
# M3 watcher: filesystem notifications on the Claude projects dir (head-approved).
notify = "6"
# Atomic temp-file+rename writes for settings.json / state.json (also used in tests).
tempfile = "3"
# Local advisor inference. Optional and OFF by default: it links llama.cpp, so
# enabling it puts a C++/cmake toolchain on the critical path of every build.
# Piggy ships without an LLM; this is what the opt-in build turns on.
llama-cpp-2 = { version = "0.1.153", optional = true }
# Needed to hold ONE decoder across a whole generation: llama.cpp emits tokens
# whose bytes can split a multi-byte character, so a fresh decoder per token
# mangles any non-ASCII output. Version tracks llama-cpp-2's own so the two
# resolve to a single crate.
encoding_rs = { version = "0.8.35", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# The local advisor. Weights are downloaded at runtime (data, sha256-verified);
# the inference code is linked in here so what executes is what was signed.
local-llm = ["dep:llama-cpp-2", "dep:encoding_rs"]
# Apple GPU offload. Separate from `local-llm` so a CI build can compile the
# advisor without a Metal toolchain.
metal = ["llama-cpp-2/metal"]
