[package]
name = "piggy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "piggy CLI: measure Claude Code token usage from session logs."

[[bin]]
name = "piggy"
path = "src/main.rs"

[dependencies]
piggy-core = { path = "../piggy-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
# The acceptance harness builds every sandbox under a temp dir. Not a new
# dependency: `piggy-core` already links tempfile for its atomic writes, so this
# adds nothing to compile and nothing to the shipped binary.
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
