[workspace]
members = ["crates/piggy-core", "crates/piggy-cli", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

# Attribution (1000-resample bootstrap per saver over every indexed session) is
# pure arithmetic, and unoptimized it is ~20x slower: `piggy report` measured
# 3.1s release vs 60.7s debug on a 20k-session store. That 60s is exactly the
# "Checking Piggy…" spinner under `tauri dev`. Optimize the math crate and the
# deps; the app/CLI crates stay at opt-level 0 so incremental rebuilds stay fast.
[profile.dev.package.piggy-core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
